name: wxread

on:
  schedule:
    # 每天北京时间 08:30（UTC 00:30）
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wxread
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3
      - name: Run 20-minute reading task
        env:
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
          READ_NUM: '40'
        run: |
          if [ -z "$WXREAD_CURL_BASH" ]; then
            echo "Please configure the WXREAD_CURL_BASH repository secret."
            exit 1
          fi
          python main.py
